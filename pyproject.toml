[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ethtimer"
version = "2.0.0"
description = "Cycle-accurate timing of Ethernet request/response exchanges, with a microcontroller as the instrument"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Colin O'Flynn" }]
keywords = ["ethernet", "timing", "measurement", "stm32", "instrumentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

# numpy and pyserial are what taking a measurement needs, and nothing else is.
# The acceptance check deliberately does NOT add a crypto dependency -- see
# ethtimer/aes.py for why a capture that cannot be verified is worse than a
# slow one.
dependencies = ["numpy>=1.20", "pyserial>=3.5"]

[project.optional-dependencies]
# The demos' own dependency, not the instrument's. demos/oscore/oscore_py.py
# needs AES-CCM for RFC 8613, and demos/tls/make_certs.py generates a
# certificate; the TLS capture itself uses the standard library's `ssl`.
#
# `dev` includes it because tests/test_oscore_py.py exercises the OSCORE client
# against the RFC's vectors. It was left out once, and CI on a clean runner is
# what found that -- the tests pass on any machine that happens to have
# cryptography installed for something else.
demos = ["cryptography>=3.4"]
tls = ["cryptography>=3.4"]
dev = ["pytest>=7.0", "cryptography>=3.4"]

[project.urls]
Homepage = "https://github.com/colinoflynn/ethtimer"
Source = "https://github.com/colinoflynn/ethtimer"

[project.scripts]
ethtimer = "ethtimer.cli:main"

[tool.setuptools]
# The host library only. `demos/` is deliberately NOT packaged: an adapter is
# loaded by path (`--module`) or found relative to the repository root, and the
# protocol libraries beside it are example code, not an API. Packaging them
# would make `import snmp3` mean something outside this tree.
packages = ["ethtimer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
